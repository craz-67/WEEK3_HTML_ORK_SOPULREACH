<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        html, body{
            margin: 0;
            padding: 0;
        }
        #container{
            padding: 0 3em;
        }
    </style>
</head>
<body>
    <div id="container" style="background-color: rgb(7, 7, 136); width: 100vw; height: 100vh; display: flex; flex-direction: row; gap: 3em;">
        <div style="background-color: rgb(117, 196, 117); width: 40%; height: 100%; flex-grow: 1;"></div>
        <div style="background-color: rgb(255, 218, 149); height: 100%; width: 10em; padding: 1em; display: flex; flex-direction: column; gap: 1em;">
            <div style="background-color: lightblue; width: 100%; height: 100px;"></div>
            <div style="background-color: lightblue; width: 100%; height: 100px;"></div>
            <div style="background-color: lightblue; width: 100%; height: 100px;"></div>
        </div>
    </div>
</body>
</html>
