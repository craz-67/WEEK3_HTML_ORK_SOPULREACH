<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body{
            margin: 0;
            padding: 0;
        }
        #container{
            padding: 0 10em;
        }
    </style>
</head>
<body>
    <div id="container" style="background-color: pink; width: 100%; height: 100vh; display: flex; flex-direction: column;justify-content: start;">
        <div style="background-color: greenyellow; height: 100vh; width: 100%; padding: 0; display: flex; flex-direction: column; gap: 1em;">
            <div style="height: 100px; background-color: grey;" height">
                <p style="margin: 0;">Header</p>
            </div>
            <div style="height: 100px;flex-grow: 1; background-color: grey;" height">
                <p style="margin: 0;">Main</p>
            </div>
            <div style="height: 100px; background-color: grey;" height">
                <p style="margin: 0;">Footer</p>
            </div>
        </div>
    </div>
</body>
</html>
